[package]
name = "ql-raster"
description = "Brother QL label printers: labels as bitmaps, raster jobs, printing over TCP 9100 and USB, status."
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/eflukx/ql-raster"
keywords = ["brother", "label", "printer", "ql-710w", "raster"]
categories = ["hardware-support"]
license = "MIT OR Apache-2.0"
authors = ["Rogier Lodewijks <rogier@lodewijks.org>"]

[dependencies]
ab_glyph = "0.2"
bitflags = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }
snmp = { version = "0.2.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[features]
default = ["net"]
# Network printing: TCP 9100, SNMP status, searching the network.
net = ["dep:snmp"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
must_use_candidate = "warn"
